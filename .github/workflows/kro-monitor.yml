name: KRO 12h Monitor

# Запуск в 12:00 и 00:00 МСК каждый день
# МСК = UTC+3, поэтому:  12:00 МСК = 09:00 UTC | 00:00 МСК = 21:00 UTC (предыдущего дня)
#
# После успешного цикла монитора: POST на Render Deploy Hook (секрет RENDER_DEPLOY_HOOK).
# Создать hook: Render → сервис → Settings → Deploy Hook → Create hook → URL в GitHub → Secrets.
on:
  schedule:
    - cron: '0 9 * * *'   # 12:00 MSK
    - cron: '0 21 * * *'  # 00:00 MSK
  workflow_dispatch:       # ручной запуск из вкладки Actions для теста

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    # Полный collect (веб-парсинг, DDG и т.д.) с раннера GitHub часто >30 мин из‑за таймаутов сети
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r backend/kro-worker/requirements.txt

      # Только BASE64 — битый KRO_GOOGLE_CREDENTIALS_JSON в env больше не трогаем на этом шаге.
      - name: Write Google credentials file
        env:
          KRO_GOOGLE_CREDENTIALS_BASE64: ${{ secrets.KRO_GOOGLE_CREDENTIALS_BASE64 }}
        run: python3 "${{ github.workspace }}/.github/scripts/write-google-credentials.py"

      - name: Read previous last_cycle_at snapshot
        id: pre_cycle
        working-directory: backend/kro-worker
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
        run: |
          python3 - <<'PY'
          import os, json, sys
          from pathlib import Path
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          prev = ''
          try:
              sheet_id = os.environ.get('KRO_SHEET_ID', '').strip()
              cred_path = os.environ.get('GOOGLE_APPLICATION_CREDENTIALS', 'credentials.json').strip()
              p = Path(cred_path)
              if not p.is_absolute():
                  p = Path(os.getcwd()) / p
              if not sheet_id or not p.is_file():
                  raise RuntimeError('missing KRO_SHEET_ID or credentials file')
              creds_info = json.loads(p.read_text(encoding='utf-8'))
              creds = Credentials.from_service_account_info(creds_info, scopes=['https://www.googleapis.com/auth/spreadsheets.readonly'])
              svc = build('sheets', 'v4', credentials=creds, cache_discovery=False)
              rows = svc.spreadsheets().values().get(spreadsheetId=sheet_id, range='kro_meta!A:B').execute().get('values', [])
              kv = {(r[0] if len(r) > 0 else ''): (r[1] if len(r) > 1 else '') for r in rows}
              prev = str(kv.get('last_cycle_at', '')).strip()
          except Exception as e:
              print(f'warning: unable to read previous last_cycle_at: {e}', file=sys.stderr)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'previous={prev}\n')
          print(f'kro_meta.last_cycle_at(before)={prev or "<empty>"}')
          PY

      - name: Run 12h monitor
        working-directory: backend/kro-worker
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          # Google Sheets / Docs IDs
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
          KRO_SOURCES_DOC_ID: ${{ secrets.KRO_SOURCES_DOC_ID }}
          # Render сайт — куда постить итоговую статистику
          KRO_SITE_UPDATE_URL: https://crypto-academy-pro.onrender.com/api/kro/update
          # Режим: collect = полный цикл (TGStat + веб-парсер + Google Sheets + отправка на сайт)
          MODE: collect
        run: python3 run_12h_monitor.py

      # Один процесс Python: verify + data-quality (node через subprocess).
      # Так GitHub не показывает лишние «exit code 1» от дочернего node.
      - name: Install backend node deps (for data-quality check)
        run: npm --prefix backend ci

      - name: Post-checks (last_cycle_at + data-quality)
        env:
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
          PREVIOUS_LAST_CYCLE_AT: ${{ steps.pre_cycle.outputs.previous }}
          GOOGLE_APPLICATION_CREDENTIALS: backend/kro-worker/credentials.json
          KRO_SCAM_BASE_RANGE: scam_base!A2:N
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/kro-ci-post-checks.py"

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "RENDER_DEPLOY_HOOK is not set; skipping Render deploy."
            exit 0
          fi
          echo "Triggering Render deploy via hook..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy hook OK."
