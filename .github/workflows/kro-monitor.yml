name: KRO 12h Monitor

# Запуск в 12:00 и 00:00 МСК каждый день
# МСК = UTC+3, поэтому:  12:00 МСК = 09:00 UTC | 00:00 МСК = 21:00 UTC (предыдущего дня)
on:
  schedule:
    - cron: '0 9 * * *'   # 12:00 MSK
    - cron: '0 21 * * *'  # 00:00 MSK
  workflow_dispatch:       # ручной запуск из вкладки Actions для теста

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r backend/kro-worker/requirements.txt

      - name: Write Google credentials file
        run: |
          echo '${{ secrets.KRO_GOOGLE_CREDENTIALS_JSON }}' > backend/kro-worker/credentials.json

      - name: Read previous last_cycle_at snapshot
        id: pre_cycle
        working-directory: backend/kro-worker
        env:
          KRO_GOOGLE_CREDENTIALS_JSON: ${{ secrets.KRO_GOOGLE_CREDENTIALS_JSON }}
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
        run: |
          python3 - <<'PY'
          import os, json, sys
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          prev = ''
          try:
              sheet_id = os.environ.get('KRO_SHEET_ID', '').strip()
              raw = os.environ.get('KRO_GOOGLE_CREDENTIALS_JSON', '').strip()
              if not sheet_id or not raw:
                  raise RuntimeError('missing KRO_SHEET_ID or KRO_GOOGLE_CREDENTIALS_JSON')
              creds_info = json.loads(raw)
              creds = Credentials.from_service_account_info(creds_info, scopes=['https://www.googleapis.com/auth/spreadsheets.readonly'])
              svc = build('sheets', 'v4', credentials=creds, cache_discovery=False)
              rows = svc.spreadsheets().values().get(spreadsheetId=sheet_id, range='kro_meta!A:B').execute().get('values', [])
              kv = {(r[0] if len(r) > 0 else ''): (r[1] if len(r) > 1 else '') for r in rows}
              prev = str(kv.get('last_cycle_at', '')).strip()
          except Exception as e:
              print(f'warning: unable to read previous last_cycle_at: {e}', file=sys.stderr)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'previous={prev}\n')
          print(f'kro_meta.last_cycle_at(before)={prev or "<empty>"}')
          PY

      - name: Run 12h monitor
        working-directory: backend/kro-worker
        env:
          # Google API — передаём JSON двумя способами: переменная + файл
          KRO_GOOGLE_CREDENTIALS_JSON: ${{ secrets.KRO_GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          # Google Sheets / Docs IDs
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
          KRO_SOURCES_DOC_ID: ${{ secrets.KRO_SOURCES_DOC_ID }}
          # Render сайт — куда постить итоговую статистику
          KRO_SITE_UPDATE_URL: https://crypto-academy-pro.onrender.com/api/kro/update
          # Режим: collect = полный цикл (TGStat + веб-парсер + Google Sheets + отправка на сайт)
          MODE: collect
        run: python3 run_12h_monitor.py

      - name: Verify last_cycle_at freshness in kro_meta
        working-directory: backend/kro-worker
        env:
          KRO_GOOGLE_CREDENTIALS_JSON: ${{ secrets.KRO_GOOGLE_CREDENTIALS_JSON }}
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
          PREVIOUS_LAST_CYCLE_AT: ${{ steps.pre_cycle.outputs.previous }}
        run: |
          python3 - <<'PY'
          import os, json, sys
          from datetime import datetime, timezone
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          sheet_id = os.environ.get('KRO_SHEET_ID', '').strip()
          raw = os.environ.get('KRO_GOOGLE_CREDENTIALS_JSON', '').strip()
          if not sheet_id or not raw:
              print('missing KRO_SHEET_ID or KRO_GOOGLE_CREDENTIALS_JSON', file=sys.stderr)
              sys.exit(1)
          creds_info = json.loads(raw)
          creds = Credentials.from_service_account_info(creds_info, scopes=['https://www.googleapis.com/auth/spreadsheets.readonly'])
          svc = build('sheets', 'v4', credentials=creds, cache_discovery=False)
          rows = svc.spreadsheets().values().get(spreadsheetId=sheet_id, range='kro_meta!A:B').execute().get('values', [])
          kv = { (r[0] if len(r)>0 else ''): (r[1] if len(r)>1 else '') for r in rows }
          last_cycle = str(kv.get('last_cycle_at', '')).strip()
          if not last_cycle:
              print('kro_meta.last_cycle_at is empty', file=sys.stderr)
              sys.exit(1)
          try:
              ts = datetime.fromisoformat(last_cycle.replace('Z', '+00:00'))
          except Exception:
              print(f'invalid last_cycle_at: {last_cycle}', file=sys.stderr)
              sys.exit(1)
          prev = os.environ.get('PREVIOUS_LAST_CYCLE_AT', '').strip()
          if prev and prev == last_cycle:
              print(f'last_cycle_at did not change after run: {last_cycle}', file=sys.stderr)
              sys.exit(1)
          age_h = (datetime.now(timezone.utc) - ts).total_seconds() / 3600.0
          print(f'kro_meta.last_cycle_at={last_cycle} age_hours={age_h:.2f}')
          if age_h > 13.0:
              print('last_cycle_at is stale (>13h)', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Install backend node deps (for data-quality check)
        run: npm --prefix backend ci

      - name: Run KRO data-quality post-check
        env:
          KRO_GOOGLE_CREDENTIALS_JSON: ${{ secrets.KRO_GOOGLE_CREDENTIALS_JSON }}
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
          KRO_SCAM_BASE_RANGE: scam_base!A2:N
        run: |
          node backend/scripts/kro-data-quality.mjs --json > /tmp/kro_quality.json
          cat /tmp/kro_quality.json
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('/tmp/kro_quality.json','utf8')); const badLoss=(q.lossStatusRows||[]).map(r=>r.username).filter(Boolean); const badCrypto=(q.nonCryptoRows||[]).map(r=>r.username).filter(Boolean); if((q.nonCryptoCount||0)>0 || (q.lossStatusMismatchCount||0)>0){ console.error('KRO quality violations:', q.nonCryptoCount, q.lossStatusMismatchCount); if(badCrypto.length) console.error('Non-crypto usernames:', badCrypto.join(', ')); if(badLoss.length) console.error('Loss-status usernames:', badLoss.join(', ')); process.exit(1);} console.log('KRO quality check OK');"
