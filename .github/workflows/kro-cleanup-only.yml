# Ручной запуск: только чистка scam_base (без 30+ мин полного монитора).
# Тот же секрет KRO_TELEGRAM_SESSION_STRING, что и kro-monitor.yml.
name: KRO scam_base cleanup only

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r backend/kro-worker/requirements.txt

      - name: Write Google credentials file
        env:
          KRO_GOOGLE_CREDENTIALS_BASE64: ${{ secrets.KRO_GOOGLE_CREDENTIALS_BASE64 }}
        run: python3 "${{ github.workspace }}/.github/scripts/write-google-credentials.py"

      - name: Check Telethon StringSession secret
        env:
          KRO_TELEGRAM_SESSION_STRING: ${{ secrets.KRO_TELEGRAM_SESSION_STRING }}
        run: |
          if [ -z "${KRO_TELEGRAM_SESSION_STRING:-}" ]; then
            echo "::error::Задайте KRO_TELEGRAM_SESSION_STRING (python3 backend/kro-worker/convert_session.py)."
            exit 1
          fi

      - name: Run scam_base cleanup
        env:
          GOOGLE_APPLICATION_CREDENTIALS: backend/kro-worker/credentials.json
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_NAME: kro_worker
          KRO_TELEGRAM_SESSION_STRING: ${{ secrets.KRO_TELEGRAM_SESSION_STRING }}
          KRO_CLEANUP_EXTRA_DELETE: ${{ secrets.KRO_CLEANUP_EXTRA_DELETE }}
        run: python3 backend/scripts/kro-cleanup-scam-base.py

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "RENDER_DEPLOY_HOOK is not set; skipping Render deploy."
            exit 0
          fi
          echo "Triggering Render deploy via hook..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy hook OK."
