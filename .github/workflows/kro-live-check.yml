name: KRO Live Check

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:
    inputs:
      username:
        description: "Telegram channel username (e.g. @wyckoff_company)"
        required: false
        type: string

jobs:
  process-live-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r backend/kro-worker/requirements.txt

      - name: Write Google credentials file
        env:
          KRO_GOOGLE_CREDENTIALS_BASE64: ${{ secrets.KRO_GOOGLE_CREDENTIALS_BASE64 }}
        run: python3 "${{ github.workspace }}/.github/scripts/write-google-credentials.py"

      - name: Process pending live requests
        working-directory: backend/kro-worker
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
          KRO_CHECK_REQUESTS_RANGE: ${{ vars.KRO_CHECK_REQUESTS_RANGE }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          KRO_TELEGRAM_SESSION_STRING: ${{ secrets.KRO_TELEGRAM_SESSION_STRING }}
          KRO_CHECK_USERNAME: ${{ github.event.inputs.username }}
        run: |
          if [ -z "${KRO_CHECK_REQUESTS_RANGE:-}" ]; then export KRO_CHECK_REQUESTS_RANGE="kro_check_requests!A2:E"; fi
          python3 run_live_check_requests.py
