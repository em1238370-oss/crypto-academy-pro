name: KRO Check Channel Queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      username:
        description: "Telegram channel username (e.g. @ton618_crypto)"
        required: false
        type: string

jobs:
  process-check-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r backend/kro-worker/requirements.txt

      - name: Write Google credentials file
        env:
          KRO_GOOGLE_CREDENTIALS_BASE64: ${{ secrets.KRO_GOOGLE_CREDENTIALS_BASE64 }}
        run: python3 "${{ github.workspace }}/.github/scripts/write-google-credentials.py"

      - name: Process check queue
        working-directory: backend/kro-worker
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
          KRO_CHECK_QUEUE_RANGE: ${{ vars.KRO_CHECK_QUEUE_RANGE }}
          KRO_CHECK_RESULTS_RANGE: ${{ vars.KRO_CHECK_RESULTS_RANGE }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          KRO_TELEGRAM_SESSION_STRING: ${{ secrets.KRO_TELEGRAM_SESSION_STRING }}
          KRO_CHECK_USERNAME: ${{ github.event.inputs.username }}
        run: |
          if [ -z "${KRO_CHECK_QUEUE_RANGE:-}" ]; then export KRO_CHECK_QUEUE_RANGE="kro_check_queue!A2:G"; fi
          if [ -z "${KRO_CHECK_RESULTS_RANGE:-}" ]; then export KRO_CHECK_RESULTS_RANGE="kro_check_results!A2:I"; fi
          python3 run_check_queue.py
