name: KRO Delete scam_base rows by status (не по теме)

# Удаляет строки, где колонка M содержит «не по теме» / off_topic (надёжнее, чем матч по username).
on:
  workflow_dispatch:
  repository_dispatch:
    types: [kro-delete-by-status]

jobs:
  delete-by-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Dispatch hint (CLI / API)
        run: |
          echo "Статус: workflow id 257452507 (см. API Actions)."
          echo "Запуск без UI (нужен PAT с правом actions:write):"
          echo '  curl -sS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }}/actions/workflows/257452507/dispatches -d "{\"ref\":\"main\"}"'
          echo "Или repository_dispatch:"
          echo '  curl -sS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer TOKEN" https://api.github.com/repos/${{ github.repository }}/dispatches -d "{\"event_type\":\"kro-delete-by-status\",\"client_payload\":{}}"'

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r backend/kro-worker/requirements.txt

      - name: Write Google credentials file
        env:
          KRO_GOOGLE_CREDENTIALS_BASE64: ${{ secrets.KRO_GOOGLE_CREDENTIALS_BASE64 }}
        run: python3 "${{ github.workspace }}/.github/scripts/write-google-credentials.py"

      - name: Delete off-topic rows by column M
        env:
          GOOGLE_APPLICATION_CREDENTIALS: backend/kro-worker/credentials.json
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
        run: |
          set -euo pipefail
          python3 backend/scripts/kro-delete-by-status.py
