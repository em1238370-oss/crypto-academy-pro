name: KRO Delete off-topic rows (scam_base)

# Удаляет из листа scam_base строки из backend/scripts/data/off-topic-channels-delete-list.txt
# и при необходимости обнуляет непроверённую сумму у @incom_biz.
on:
  workflow_dispatch:

jobs:
  delete-off-topic:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r backend/kro-worker/requirements.txt

      - name: Write Google credentials file
        env:
          KRO_GOOGLE_CREDENTIALS_BASE64: ${{ secrets.KRO_GOOGLE_CREDENTIALS_BASE64 }}
        run: python3 "${{ github.workspace }}/.github/scripts/write-google-credentials.py"

      - name: Batch delete off-topic channels from scam_base
        env:
          GOOGLE_APPLICATION_CREDENTIALS: backend/kro-worker/credentials.json
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
        run: |
          set -euo pipefail
          python3 backend/scripts/kro-delete-scam-base-batch.py \
            backend/scripts/data/off-topic-channels-delete-list.txt

      - name: Honest zero for @incom_biz if source_evidence empty
        env:
          GOOGLE_APPLICATION_CREDENTIALS: backend/kro-worker/credentials.json
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
        run: |
          set -euo pipefail
          python3 backend/scripts/kro-fix-incom-biz-unverified-loss.py
