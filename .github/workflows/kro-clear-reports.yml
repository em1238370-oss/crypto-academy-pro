# Очистка листа reports: удалить все строки данных, оставить только заголовок (строка 1).
# Раньше даты писались как USER_ENTERED и превращались в сериалы — после очистки новые строки пишутся с RAW.
#
# Запуск: GitHub → Actions → KRO Clear reports → Run workflow.
# Секреты: KRO_GOOGLE_CREDENTIALS_BASE64, KRO_SHEET_ID.
on:
  workflow_dispatch:

jobs:
  clear-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r backend/kro-worker/requirements.txt

      - name: Write Google credentials file
        env:
          KRO_GOOGLE_CREDENTIALS_BASE64: ${{ secrets.KRO_GOOGLE_CREDENTIALS_BASE64 }}
        run: python3 "${{ github.workspace }}/.github/scripts/write-google-credentials.py"

      - name: Verify KRO_SHEET_ID
        env:
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
        run: |
          if [ -z "${KRO_SHEET_ID:-}" ]; then
            echo "::error::Секрет KRO_SHEET_ID не задан."
            exit 1
          fi

      - name: Clear reports sheet (keep header)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/backend/kro-worker/credentials.json
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
        run: python3 "${{ github.workspace }}/backend/scripts/kro-clear-reports-keep-header.py"
