name: KRO Enforce Channel Filters

on:
  workflow_dispatch:

jobs:
  enforce-filters:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r backend/kro-worker/requirements.txt

      - name: Write Google credentials file
        env:
          KRO_GOOGLE_CREDENTIALS_BASE64: ${{ secrets.KRO_GOOGLE_CREDENTIALS_BASE64 }}
        run: python3 "${{ github.workspace }}/.github/scripts/write-google-credentials.py"

      - name: Run strict channel filters on scam_base
        env:
          GOOGLE_APPLICATION_CREDENTIALS: backend/kro-worker/credentials.json
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
          KRO_SCAM_BASE_RANGE: scam_base!A2:N
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_NAME: kro_session
        run: |
          set -euo pipefail
          python3 backend/scripts/kro-enforce-channel-filters.py 2>&1 | tee /tmp/kro-enforce-filters.log

      - name: Validate enforce-filters run output (no silent green)
        run: |
          set -euo pipefail
          if ! rg -q "Checked telegram rows:" /tmp/kro-enforce-filters.log; then
            echo "Missing completion marker from enforce script. Treating as system failure."
            exit 1
          fi
          if rg -q "skip_channel:" /tmp/kro-enforce-filters.log; then
            echo "Detected per-channel soft-skip entries (expected for isolated Telethon/channel issues)."
          fi
