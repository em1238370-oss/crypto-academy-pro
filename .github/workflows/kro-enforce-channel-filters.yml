name: KRO Enforce Channel Filters

on:
  workflow_dispatch:

jobs:
  enforce-filters:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r backend/kro-worker/requirements.txt

      - name: Write Google credentials file
        env:
          KRO_GOOGLE_CREDENTIALS_JSON: ${{ secrets.KRO_GOOGLE_CREDENTIALS_JSON }}
        run: python3 "${{ github.workspace }}/.github/scripts/write-google-credentials.py"

      - name: Run strict channel filters on scam_base
        env:
          KRO_GOOGLE_CREDENTIALS_JSON: ${{ secrets.KRO_GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: backend/kro-worker/credentials.json
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
          KRO_SCAM_BASE_RANGE: scam_base!A2:N
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_NAME: kro_session
        run: |
          set +e
          python3 backend/scripts/kro-enforce-channel-filters.py
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::enforce-channel-filters exited with $code (Telethon/фильтры — см. лог)"
          fi
          exit 0
