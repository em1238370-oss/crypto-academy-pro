# workflow_dispatch: нормализация ссылок Telegram в колонке B листа scam_base
# (t.me без @ в пути, telegram.me → t.me, tg://resolve?domain= → https://t.me/…).
# Секреты: KRO_GOOGLE_CREDENTIALS_BASE64, KRO_SHEET_ID (как у остальных KRO workflows).
name: KRO Fix scam_base Telegram links (col B)

on:
  workflow_dispatch:

jobs:
  fix-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r backend/kro-worker/requirements.txt

      - name: Write Google credentials file
        env:
          KRO_GOOGLE_CREDENTIALS_BASE64: ${{ secrets.KRO_GOOGLE_CREDENTIALS_BASE64 }}
        run: python3 "${{ github.workspace }}/.github/scripts/write-google-credentials.py"

      - name: Verify KRO_SHEET_ID
        env:
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
        run: |
          if [ -z "${KRO_SHEET_ID:-}" ]; then
            echo "::error::Секрет KRO_SHEET_ID не задан в репозитории."
            exit 1
          fi
          echo "::notice::KRO_SHEET_ID задан (длина ${#KRO_SHEET_ID} символов)."

      - name: Normalize scam_base column B (execute)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/backend/kro-worker/credentials.json
          KRO_SHEET_ID: ${{ secrets.KRO_SHEET_ID }}
          KRO_SCAM_BASE_RANGE: scam_base!A2:N
        run: |
          echo "::notice::Обновление только scam_base колонка B (строки 2+). Заголовок строка 1 не трогаем."
          python3 "${{ github.workspace }}/backend/scripts/kro-fix-scam-base-telegram-links.py" --execute
