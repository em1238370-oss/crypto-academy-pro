# Render Blueprint: Node API + Python 3 + Telethon (см. корневой Dockerfile).
# Подключите репозиторий как Blueprint или вручную создайте Web Service с Docker.
#
# Обязательные секреты (Environment) для живой проверки каналов:
#   TELEGRAM_API_ID, TELEGRAM_API_HASH,
#   и ОДИН из вариантов сессии:
#   - KRO_TELEGRAM_SESSION_STRING (StringSession из convert_session.py), или
#   - TELEGRAM_SESSION_B64 (base64 от бинарного kro_worker.session — совместимо со старым продом)
# Плюс существующие: KRO_SHEET_ID, KRO_GOOGLE_CREDENTIALS_JSON, и т.д.

services:
  - type: web
    name: crypto-academy-pro
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
